<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="hBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#00288e" />
      <stop offset="100%" stop-color="#0b1736" />
    </linearGradient>

    <linearGradient id="hEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="hGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00288e" flood-opacity="0.18" />
    </filter>
    <filter id="hCheckGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Logo Mark (Scaled into 140x140 area) -->
  <g transform="translate(10, 10) scale(0.273)" filter="url(#hGlow)">
    <!-- Base Radar / Geofence Rings -->
    <circle cx="256" cy="270" r="195" stroke="#cbd5e1" stroke-width="5" stroke-dasharray="10 10" />
    <circle cx="256" cy="270" r="160" stroke="#93c5fd" stroke-width="4" opacity="0.6" />
    <circle cx="395" cy="185" r="9" fill="#10b981" />
    
    <!-- Dynamic Shield / Attendance Ring -->
    <path d="M 125,320 A 150,150 0 1,0 406,270" 
          stroke="url(#hBlueGrad)" 
          stroke-width="22" 
          stroke-linecap="round" />

    <path d="M 115,280 A 150,150 0 0,0 256,420 A 150,150 0 0,0 345,392" 
          stroke="url(#hEmeraldGrad)" 
          stroke-width="22" 
          stroke-linecap="round" />

    <!-- Academic Cap / Mortarboard -->
    <polygon points="256,92 388,148 256,204 124,148" fill="url(#hBlueGrad)" />
    <polygon points="256,92 388,148 256,155 124,148" fill="#38bdf8" opacity="0.35" />
    <path d="M 175,170 L 175,225 C 175,255 337,255 337,225 L 337,170 C 310,185 285,190 256,190 C 227,190 202,185 175,170 Z" fill="#002166" />
    
    <!-- Tassel -->
    <ellipse cx="256" cy="148" rx="12" ry="8" fill="url(#hGoldGrad)" />
    <path d="M 256,150 Q 200,165 176,210" fill="none" stroke="url(#hGoldGrad)" stroke-width="6" stroke-linecap="round" />
    <ellipse cx="176" cy="214" rx="7" ry="5" fill="url(#hGoldGrad)" />
    <path d="M 173,218 L 170,250 C 170,254 182,254 182,250 L 179,218 Z" fill="url(#hGoldGrad)" />

    <!-- Book Base -->
    <path d="M 256,335 C 220,315 165,318 135,335 L 135,368 C 165,350 220,347 256,368 Z" fill="url(#hBlueGrad)" opacity="0.9" />
    <path d="M 256,335 C 292,315 347,318 377,335 L 377,368 C 347,350 292,347 256,368 Z" fill="url(#hBlueGrad)" opacity="0.9" />
    <path d="M 256,335 L 256,375" stroke="url(#hGoldGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- Verified Checkmark -->
    <g filter="url(#hCheckGlow)">
      <path d="M 198,285 L 246,333 L 362,205" 
            fill="none" 
            stroke="url(#hEmeraldGrad)" 
            stroke-width="30" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <path d="M 200,285 L 246,330 L 360,206" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="6" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            opacity="0.6" />
    </g>

    <!-- Signal waves -->
    <path d="M 342,125 A 32,32 0 0,1 374,157" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    <path d="M 356,112 A 52,52 0 0,1 400,154" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Vertical Divider Bar -->
  <line x1="165" y1="28" x2="165" y2="132" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />

  <!-- Right Typography & Branding -->
  <g transform="translate(185, 0)">
    <!-- Primary Title: E-PRESENSI GTK -->
    <g transform="translate(0, 68)">
      <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="44" 
            font-weight="900" 
            letter-spacing="-0.03em" 
            fill="#0b1c30">
        E-PRESENSI
      </text>
      
      <text x="282" 
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="44" 
            font-weight="900" 
            letter-spacing="-0.01em" 
            fill="url(#hGoldGrad)">
        GTK
      </text>

      <!-- Badge "v2.0" -->
      <g transform="translate(390, -32)">
        <rect width="52" height="22" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
        <text x="26" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#047857">
          v2.0
        </text>
      </g>
    </g>

    <!-- Subtitle: GURU & TENAGA KEPENDIDIKAN -->
    <text x="2" y="98" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="15" 
          font-weight="700" 
          letter-spacing="0.14em" 
          fill="#00288e" 
          opacity="0.95">
      GURU &amp; TENAGA KEPENDIDIKAN
    </text>

    <!-- Feature Tags: Geofence GPS • Presensi Real-Time -->
    <g transform="translate(2, 122)">
      <!-- Tag 1: Geofence GPS -->
      <circle cx="4" cy="-4" r="3" fill="#10b981" />
      <text x="12" y="0" 
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
            font-size="12" 
            font-weight="600" 
            fill="#64748b" 
            letter-spacing="0.02em">
        Presensi Berbasis Geofence GPS
      </text>

      <!-- Dot separator -->
      <circle cx="218" cy="-4" r="2.5" fill="#cbd5e1" />

      <!-- Tag 2: Cloud Sync -->
      <circle cx="236" cy="-4" r="3" fill="#0284c7" />
      <text x="244" y="0" 
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
            font-size="12" 
            font-weight="600" 
            fill="#64748b" 
            letter-spacing="0.02em">
        Validasi Wajah &amp; Radius Akurat
      </text>
    </g>
  </g>
</svg>
